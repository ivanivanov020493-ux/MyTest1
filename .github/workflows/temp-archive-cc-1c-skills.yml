name: Temp package cc-1c-skills

on:
  push:
    paths:
      - '.github/workflows/temp-archive-cc-1c-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact snapshot
        run: |
          set -euo pipefail
          git clone https://github.com/Nikolay-Shirokov/cc-1c-skills.git cc-1c-skills
          cd cc-1c-skills
          git checkout --detach 6169a7ff939aa3c73f7d9799acf693fa3bfd33ed
          test "$(git rev-parse HEAD)" = "6169a7ff939aa3c73f7d9799acf693fa3bfd33ed"
          rm -rf .git
          cd ..
          zip -qr cc-1c-skills-6169a7f.zip cc-1c-skills
          unzip -tq cc-1c-skills-6169a7f.zip
          test -f cc-1c-skills/.claude/skills/web-test/SKILL.md
          test -f cc-1c-skills/README.md
          sha256sum cc-1c-skills-6169a7f.zip > cc-1c-skills-6169a7f.zip.sha256
      - name: Upload frozen archive
        uses: actions/upload-artifact@v4
        with:
          name: cc-1c-skills-6169a7f
          path: |
            cc-1c-skills-6169a7f.zip
            cc-1c-skills-6169a7f.zip.sha256
          if-no-files-found: error
          retention-days: 1
