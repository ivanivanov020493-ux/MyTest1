name: Temp test Infostart scraper

on:
  push:
    paths:
      - '.github/workflows/temp-test-infostart-scraper.yml'

permissions:
  contents: read

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Environment
        run: |
          python --version
          curl -I -L --max-time 30 https://infostart.ru/ || true

      - name: Restore exact scraper being tested
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > infostart_startmoney_scraper.py
          chmod +x infostart_startmoney_scraper.py
          echo 'cbe42f5e5e350f3601b147503215d49121dbdbece7fcc1bcecab79acf84df677  infostart_startmoney_scraper.py' | sha256sum -c -
          python -m py_compile infostart_startmoney_scraper.py

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run scraper against real Infostart
        shell: bash
        run: |
          set +e
          python infostart_startmoney_scraper.py --source catalog --limit 10 --max-pages 10 --delay 1.5 --timeout 30 --out real_first10 > scraper.stdout.log 2> scraper.stderr.log
          status=$?
          echo "$status" > scraper.exitcode
          echo '=== STDOUT ==='
          cat scraper.stdout.log
          echo '=== STDERR ==='
          cat scraper.stderr.log
          echo "exit_code=$status"
          ls -lah real_first10* scraper.* || true
          exit "$status"

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infostart-scraper-real-test
          path: |
            infostart_startmoney_scraper.py
            real_first10*.json
            real_first10*.csv
            scraper.stdout.log
            scraper.stderr.log
            scraper.exitcode
          retention-days: 1
