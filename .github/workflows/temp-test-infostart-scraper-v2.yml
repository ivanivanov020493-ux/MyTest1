name: Temp test Infostart scraper v2

on:
  push:
    paths:
      - '.github/workflows/temp-test-infostart-scraper-v2.yml'

permissions:
  contents: read

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restore fixed scraper
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > infostart_startmoney_scraper.py
          echo '119d716908a2488ebed5b1e5ad2721303798c4de7a2dfa71c7c3608ac1c8a384  infostart_startmoney_scraper.py' | sha256sum -c -
          python -m py_compile infostart_startmoney_scraper.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run fixed scraper
        shell: bash
        run: |
          python infostart_startmoney_scraper.py --source catalog --limit 10 --max-pages 10 --delay 1.2 --timeout 30 --out real_first10_v2
          python - <<'PY'
          import json,sys
          d=json.load(open('real_first10_v2.json',encoding='utf-8'))
          assert len(d)==10, len(d)
          assert all(x['created_at'] for x in d), [x['id'] for x in d if not x['created_at']]
          assert all(x['updated_at'] for x in d), [x['id'] for x in d if not x['updated_at']]
          assert all(x['file_type']=='Внешняя обработка (ert,epf)' for x in d)
          assert all(x['access_type']=='Абонемент ($m)' for x in d)
          assert all(x['startmoney'] and x['startmoney']>0 for x in d)
          assert all(any(f.get('extension') in ('.epf','.ert') for f in x['files']) for x in d)
          print('VALIDATION_OK')
          for x in d:
              prices=[f.get('price_rub') for f in x['files'] if f.get('price_rub')]
              print(x['id'],x['created_at'],x['updated_at'],x['startmoney'],prices,x['title'])
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: infostart-scraper-real-test-v2
          path: |
            infostart_startmoney_scraper.py
            real_first10_v2.json
            real_first10_v2.csv
            real_first10_v2.rejected.json
          retention-days: 1
